# Full CI -- CLAUDE.md section 15.
#
# Extends the golden-subset gate (golden-subset.yml, the named required
# check) rather than replacing it: this workflow adds lint, the whole
# test suite, and a Docker image build, so a broken Dockerfile or a
# regression outside the golden subset fails here rather than at deploy.
#
# No provider secrets are configured, and that is deliberate. The suite
# is hermetic -- conftest clears the LangSmith env vars and every LLM /
# search call is mocked -- and CLAUDE.md section 11 forbids client data
# reaching a provider without a data-processing agreement, so a change
# that needs a live key fails here instead of in front of the client.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.0
      - run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the full test suite
        run: pytest tests/ -v

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: apr-intelligence-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
