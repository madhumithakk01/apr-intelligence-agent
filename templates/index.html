<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APR Intelligence Agent</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f6f8fb; color: #14213d; }
        .container { max-width: 1200px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(20,33,61,0.1); }
        h1 { margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap: 12px 18px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #334e68; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        textarea { min-height: 90px; }
        .full { grid-column: 1 / -1; }
        button { margin-top: 18px; background: #0f62fe; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0043ce; }
    </style>
</head>
<body>
<div class="container">
    <h1>APR Intelligence Agent</h1>
    <p>Fill all 28 application fields. The agent performs TIM-E, COTS, SWOT, market comparison, and generates a downloadable PDF report.</p>
    <form method="post" action="/analyze">
        <div class="grid">
            <div><label>Application ID</label><input name="application_id" required></div>
            <div><label>Application Name</label><input name="application_name" required></div>
            <div><label>Owner</label><input name="owner" required></div>
            <div><label>Owner Email</label><input type="email" name="owner_email" required></div>
            <div><label>Department</label><input name="department" required></div>
            <div><label>Application Status</label><input name="application_status" required></div>
            <div class="full"><label>Application Description</label><textarea name="application_description" required></textarea></div>

            <div><label>Business Criticality</label><input name="business_criticality" value="High" required></div>
            <div><label>Business Fitness</label><input name="business_fitness" value="Medium" required></div>
            <div><label>Strategic Relevance</label><input name="strategic_relevance" value="High" required></div>
            <div><label>Usage & Adoption</label><input name="usage_adoption" value="Medium" required></div>
            <div><label>Functional Redundancy</label><input name="functional_redundancy" value="Low" required></div>
            <div><label>Application Security Level</label><input name="application_security_level" value="High" required></div>
            <div><label>Maintainability</label><input name="maintainability" value="Medium" required></div>
            <div><label>Application Stability</label><input name="application_stability" value="Medium" required></div>
            <div><label>Skill Availability</label><input name="skill_availability" value="Medium" required></div>
            <div><label>Availability</label><input name="availability" value="High" required></div>
            <div><label>Reliability</label><input name="reliability" value="High" required></div>
            <div><label>Scalability</label><input name="scalability" value="Medium" required></div>
            <div><label>Technology Stack</label><input name="technology_stack" required></div>

            <div><label>Annual FTE Cost</label><input type="number" step="0.01" name="annual_fte_cost" value="120000" required></div>
            <div><label>Annual License Cost</label><input type="number" step="0.01" name="annual_license_cost" value="50000" required></div>
            <div><label>FTE Count</label><input type="number" name="fte_count" value="4" required></div>
            <div><label>Annual Infrastructure Cost</label><input type="number" step="0.01" name="annual_infrastructure_cost" value="30000" required></div>
            <div><label>Other Costs</label><input type="number" step="0.01" name="other_costs" value="10000" required></div>

            <div><label>Business Capability L1</label><input name="business_capability_l1" required></div>
            <div><label>Business Capability L2</label><input name="business_capability_l2" required></div>
            <div><label>Business Capability L3</label><input name="business_capability_l3" required></div>
        </div>
        <button type="submit">Run APR Agent Analysis</button>
    </form>
</div>
</body>
</html>
